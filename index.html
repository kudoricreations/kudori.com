    <link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
    <link href="./css/style.css" rel="stylesheet">

    <link rel="icon" href="./images/favicon32.png" sizes="32x32" />
    <link rel="icon" href="./images/favicon192.png" sizes="192x192" />

<body>
<!-- Bootstrap NavBar -->
<nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <button class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <a class="navbar-brand" href="./#">
        <img src="./images/banner_long.png" class="d-inline-block align-top" alt="Kudori Creations">

    <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ml-auto">
            <!-- Menu shown only on small screens, generated from data/menu.json -->
            <li class="nav-item dropdown d-sm-block d-md-none">

        <ul class="list-group" id="sidebar-menu"></ul>
    </div><!-- sidebar-container END -->
    <!-- MAIN -->
    <main class="col p-4" id="content">
